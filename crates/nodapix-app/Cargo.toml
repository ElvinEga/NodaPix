[package]
name = "nodapix-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nodapix-imaging = { path = "../nodapix-imaging" }
nodapix-core = { path = "../nodapix-core" }
gpui.workspace = true
# runtime_shaders compiles the Metal sources at launch instead of requiring the
# Xcode Metal toolchain at build time. Drop this feature for release packaging.
gpui_macos = { workspace = true, features = ["runtime_shaders"] }
rfd.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
